[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiozesim-utils"
version = "0.1.0"
description = "Code the kiozesim apps share that does not belong in the library: weather sources, wiring."
requires-python = ">=3.11"
dependencies = ["kiozesim", "pandas>=2.2", "pydantic>=2.7"]

[tool.uv.sources]
kiozesim = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kiozesim_utils"]
