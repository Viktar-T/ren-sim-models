[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiozesim-ui"
version = "0.1.0"
description = "Web app for the kiozesim simulation library."
requires-python = ">=3.11"
dependencies = [
    "kiozesim[pv]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "matplotlib>=3.9",
]

[project.scripts]
kiozesim-ui = "kiozesim_ui.__main__:main"

[tool.uv.sources]
kiozesim = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kiozesim_ui"]
