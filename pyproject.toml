[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kioze-sim"
version = "0.1.0"
description = "Parameter-driven simulation of power generating installations (PV, wind, biogas, heat)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
pv = ["pvlib>=0.11"]
wind = ["windpowerlib>=0.2.2"]
system = ["oemof.solph>=0.5", "oemof.thermal>=0.0.6"]
fmu = ["fmpy>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/kioze_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["spec(req_id): links a test to a requirement ID in specs/"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
