# Workspace root: lists the packages and holds shared dev tooling. Not installable itself.
# Specs 0009, 0017.

[tool.uv.workspace]
members = ["kiozesim", "kiozesim-tool"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-PyYAML", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["kiozesim/tests", "kiozesim-tool/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["spec(req_id): links a test to a requirement ID in specs/"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "kiozesim/src", "kiozesim-tool/src", "kiozesim/tests", "kiozesim-tool/tests", "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["kiozesim/src", "kiozesim-tool/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pvlib.*", "windpowerlib.*", "oemof.*"]
ignore_missing_imports = true
