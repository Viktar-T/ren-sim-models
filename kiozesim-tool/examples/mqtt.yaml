# Needs an MQTT broker, e.g. a local Mosquitto. Watch the readings with:
#   mosquitto_sub -t 'kioze/#' -v
# Run: uv run kiozesim-tool sink 15min --config kiozesim-tool/examples/mqtt.yaml
speed: 60            # one simulated hour per real minute
plants:
  - type: pv
    name: roof
    datasheet: jinko_solar_jkm440n_54hl4r_b
    latitude_deg: 52.23
    longitude_deg: 21.01
    tilt_deg: 35
    azimuth_deg: 180
    n_modules: 10
    inverter_ac_kw: 4.0
weather:
  type: file
  path: day_weather.csv   # relative to this file
sinks:
  - type: mqtt
    host: localhost
    port: 1883
    topic: kioze/plants
    # qos: 1               # 0 = may be lost, 1 = confirmed (default), 2 = exactly once
    # retain: false        # true: the broker keeps the last reading for late subscribers
    # username: sim
    # password_env: KIOZE_MQTT_PASSWORD   # or password: <plain text>
  - type: stdout
