[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiozesim-tool"
version = "0.1.0"
description = "Command-line tool for the kiozesim simulation library."
requires-python = ">=3.11"
dependencies = ["kiozesim[pv]", "pyyaml>=6", "pydantic>=2.7", "pandas>=2.2"]

[project.scripts]
kiozesim-tool = "kiozesim_tool.cli:main"

[tool.uv.sources]
kiozesim = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kiozesim_tool"]
