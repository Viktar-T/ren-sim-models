[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiozesim"
version = "0.1.0"
description = "Parameter-driven simulation of power generating installations (PV, wind, biogas, heat)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
pv = ["pvlib>=0.11"]
wind = ["windpowerlib>=0.2.2"]
system = ["oemof.solph>=0.5", "oemof.thermal>=0.0.6"]
fmu = ["fmpy>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/kiozesim"]
